<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VoiceNotes</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: clamp(17px, 4.2vw, 21px); }
body {
  background: #e8f0fe; color: #0a0a0a;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  min-height: 100vh; overflow-x: hidden;
}

.screen { display: none; flex-direction: column; padding: 1.2rem 1rem 5rem; max-width: 640px; margin: 0 auto; min-height: 100vh; }
.screen.active { display: flex; }

h1 { font-size: 2rem; font-weight: 900; margin-bottom: 0.2rem; }
.sub { font-size: 0.9rem; color: #444; margin-bottom: 1.4rem; }
.card { background: #fff; border-radius: 1.2rem; padding: 1.4rem 1.2rem; margin-bottom: 1rem; box-shadow: 0 2px 16px rgba(60,80,180,0.10); }

#stato { font-size: 1.1rem; font-weight: 700; color: #333; text-align: center; margin-bottom: 1.2rem; min-height: 1.6rem; }
#stato.rec { color: #cc0000; }

#micBtn {
  display: flex; align-items: center; justify-content: center;
  width: clamp(110px,28vw,150px); height: clamp(110px,28vw,150px);
  border-radius: 50%; border: none;
  background: linear-gradient(145deg,#5b9bf8,#1a5fd4);
  box-shadow: 0 6px 24px rgba(79,142,247,0.5);
  margin: 0 auto 1.2rem; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: transform 0.12s;
}
#micBtn:active { transform: scale(0.88); }
#micBtn.rec { background: linear-gradient(145deg,#f87070,#cc0000); box-shadow: 0 6px 32px rgba(200,0,0,0.45); animation: puls 1.1s ease-in-out infinite; }
@keyframes puls { 0%,100%{box-shadow:0 6px 24px rgba(200,0,0,0.4)}50%{box-shadow:0 6px 44px rgba(200,0,0,0.65)} }
#micBtn svg { width: clamp(44px,11vw,60px); height: clamp(44px,11vw,60px); fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

#wave { display: flex; align-items: center; justify-content: center; gap: clamp(4px,1.2vw,7px); height: clamp(32px,8vw,48px); margin-bottom: 1rem; visibility: hidden; }
#wave.on { visibility: visible; }
.wb { width: clamp(5px,1.3vw,8px); background: #cc0000; border-radius: 4px; animation: wba 0.75s ease-in-out infinite; }
.wb:nth-child(1){height:25%;animation-delay:0s}.wb:nth-child(2){height:55%;animation-delay:.1s}.wb:nth-child(3){height:85%;animation-delay:.2s}.wb:nth-child(4){height:55%;animation-delay:.3s}.wb:nth-child(5){height:85%;animation-delay:.15s}.wb:nth-child(6){height:50%;animation-delay:.25s}.wb:nth-child(7){height:25%;animation-delay:.05s}
@keyframes wba { 0%,100%{transform:scaleY(0.3);opacity:0.45}50%{transform:scaleY(1);opacity:1} }

#tbox { background: #f0f4ff; border: 2px solid #b0c4f8; border-radius: 1rem; padding: 1rem; font-size: 1.05rem; line-height: 1.7; color: #0a0a0a; min-height: 5.5rem; margin-bottom: 1rem; word-break: break-word; }
.ph { color: #999; font-style: italic; } .int { color: #777; }

.btn-row { display: flex; gap: 0.7rem; }
.btn-row button { flex: 1; padding: 1rem 0.6rem; border-radius: 0.9rem; font-size: 1rem; font-weight: 800; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform 0.1s; }
.btn-row button:active { transform: scale(0.93); }
.btn-row button:disabled { opacity: 0.3; }
#btnC { background: #eef0f8; color: #333; border: 2px solid #d0d8f0; }
#btnS { background: linear-gradient(135deg,#5b9bf8,#1a5fd4); color: #fff; }

#btnNote {
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  width: 100%; padding: 1rem; border-radius: 1rem;
  background: linear-gradient(135deg,#a78bfa,#7c3aed); color: #fff;
  font-size: 1rem; font-weight: 800; border: none; cursor: pointer;
  margin-top: 0.5rem; -webkit-tap-highlight-color: transparent;
  box-shadow: 0 4px 16px rgba(124,58,237,0.35); transition: transform 0.1s;
}
#btnNote:active { transform: scale(0.96); }
#cntBadge { background: #fff; color: #7c3aed; font-size: 0.8rem; font-weight: 900; padding: 0.1rem 0.5rem; border-radius: 100px; }

/* SCHERMATA NOTE */
.note-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.2rem; }
.btn-back { width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 2px solid #d0d8f0; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; -webkit-tap-highlight-color: transparent; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.note-header h2 { font-size: 1.4rem; font-weight: 900; }

.tabs { display: flex; gap: 0; margin-bottom: 1rem; background: #fff; border-radius: 1rem; padding: 0.3rem; box-shadow: 0 2px 12px rgba(60,80,180,0.08); }
.tab { flex: 1; padding: 0.75rem 0.4rem; border-radius: 0.75rem; font-size: 0.85rem; font-weight: 700; border: none; background: transparent; color: #888; cursor: pointer; transition: all 0.18s; -webkit-tap-highlight-color: transparent; text-align: center; }
.tab.active { background: linear-gradient(135deg,#5b9bf8,#1a5fd4); color: #fff; box-shadow: 0 2px 8px rgba(79,142,247,0.4); }
.tab-badge { display: inline-block; background: rgba(255,255,255,0.3); border-radius: 100px; padding: 0 6px; font-size: 0.75rem; margin-left: 3px; }
.tab:not(.active) .tab-badge { background: #eef0f8; color: #666; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.nota { display: flex; align-items: flex-start; gap: 0.8rem; padding: 1rem; margin-bottom: 0.7rem; background: #fff; border-radius: 1rem; box-shadow: 0 1px 6px rgba(60,80,180,0.07); }
.chk { width: clamp(32px,8vw,40px); height: clamp(32px,8vw,40px); flex-shrink: 0; border-radius: 50%; border: 2.5px solid #bbb; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 900; color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent; margin-top: 0.1rem; transition: all 0.18s; }
.chk.fatto { background: #22aa55; border-color: #22aa55; }
.nota-body { flex: 1; min-width: 0; }
.ntxt { font-size: 1rem; font-weight: 600; color: #0a0a0a; line-height: 1.5; }
.ntxt.fatto { text-decoration: line-through; color: #aaa; font-weight: 400; }
.nts { font-size: 0.75rem; color: #999; margin-top: 0.3rem; }
.pill { font-size: 0.75rem; font-weight: 800; padding: 0.25rem 0.55rem; border-radius: 0.5rem; flex-shrink: 0; margin-top: 0.1rem; white-space: nowrap; }
.p-ok{background:#d0f5e0;color:#1a7a3a}.p-pnd{background:#fff3cc;color:#886600}.p-err{background:#fddede;color:#cc0000}.p-snd{background:#ddeeff;color:#0055aa}
.vuoto { font-size: 1rem; color: #aaa; text-align: center; padding: 2.5rem 0; font-style: italic; }
.btn-del { width: clamp(32px,8vw,40px); height: clamp(32px,8vw,40px); flex-shrink: 0; border-radius: 50%; border: 2px solid #fddede; background: #fff5f5; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; -webkit-tap-highlight-color: transparent; margin-top: 0.1rem; transition: all 0.18s; color: #cc0000; }
.btn-del:active { background: #fddede; transform: scale(0.88); }

#toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(80px); background: #111; color: #fff; font-size: 1rem; font-weight: 700; padding: 0.85rem 1.6rem; border-radius: 1rem; box-shadow: 0 6px 28px rgba(0,0,0,0.3); transition: transform 0.28s cubic-bezier(.2,.8,.4,1); pointer-events: none; z-index: 999; max-width: 88vw; text-align: center; }
#toast.on { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- SCHERMATA REGISTRAZIONE -->
<div id="screenRec" class="screen active">
  <h1>🎙 VoiceNotes</h1>
  <p class="sub">Parla · trascrivi · salva su Sheets</p>

  <div class="card" style="text-align:center">
    <div id="stato">Tocca il microfono per dettare</div>
    <button id="micBtn" onclick="toggleRec()">
      <svg viewBox="0 0 24 24">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
      </svg>
    </button>
    <div id="wave">
      <div class="wb"></div><div class="wb"></div><div class="wb"></div>
      <div class="wb"></div><div class="wb"></div><div class="wb"></div>
      <div class="wb"></div>
    </div>
    <div id="tbox"><span class="ph">La trascrizione apparirà qui…</span></div>
    <div class="btn-row">
      <button id="btnC" onclick="cancella()">🗑 Cancella</button>
      <button id="btnS" onclick="salva()" disabled>💾 Salva su Sheets</button>
    </div>
  </div>

  <button id="btnNote" onclick="apriNote()">
    📋 Le mie note &nbsp;<span id="cntBadge">0</span>
  </button>
</div>

<!-- SCHERMATA NOTE -->
<div id="screenNote" class="screen">
  <div class="note-header">
    <button class="btn-back" onclick="tornaRec()">←</button>
    <h2>📋 Le mie note</h2>
  </div>
  <div class="tabs">
    <button class="tab active" id="tabAperte" onclick="switchTab('Aperte')">Da fare <span class="tab-badge" id="cntAperte">0</span></button>
    <button class="tab" id="tabFatte"  onclick="switchTab('Fatte')">Fatte <span class="tab-badge" id="cntFatte">0</span></button>
    <button class="tab" id="tabTutte"  onclick="switchTab('Tutte')">Tutte <span class="tab-badge" id="cntTutte">0</span></button>
  </div>
  <div id="tabContentAperte" class="tab-content active"></div>
  <div id="tabContentFatte"  class="tab-content"></div>
  <div id="tabContentTutte"  class="tab-content"></div>
</div>

<div id="toast"></div>

<script>
// ── CONFIG (hardcoded) ──
var GAS_URL = 'https://script.google.com/macros/s/AKfycbx6GaK8V0h7Q50cR_QuorTAtno_CQ-dynQQvPE60JYM1GE_TmoHxxICEGKdDwUOhPI/exec';

// ── STATO ──
var SRClass  = null;
var rec      = null;
var staRec   = false;
var recBusy  = false;   // true mentre rec sta avviando o fermando
var fin      = '';      // testo finale accumulato
var intr     = '';      // testo interim corrente
var segmenti = 0;       // quanti segmenti finali abbiamo già salvato in fin

var note = JSON.parse(localStorage.getItem('vn8') || '[]');

// ── INIT ──
function init() {
  aggiornaBadge();
  SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SRClass) {
    document.getElementById('stato').textContent = '⚠ Usa Chrome — Safari non supporta la trascrizione';
    document.getElementById('micBtn').disabled = true;
    return;
  }
  // Non costruiamo rec qui: lo costruiamo a ogni avvio per evitare stati sporchi
}

// ── NAVIGAZIONE ──
function apriNote() {
  if (staRec) stopRec();
  renderNote();
  document.getElementById('screenRec').classList.remove('active');
  document.getElementById('screenNote').classList.add('active');
}
function tornaRec() {
  document.getElementById('screenNote').classList.remove('active');
  document.getElementById('screenRec').classList.add('active');
}
function switchTab(nome) {
  ['Aperte','Fatte','Tutte'].forEach(function(t) {
    document.getElementById('tab'+t).classList.toggle('active', t === nome);
    document.getElementById('tabContent'+t).classList.toggle('active', t === nome);
  });
}

// ── MICROFONO ──
function toggleRec() {
  if (recBusy) return;
  staRec ? stopRec() : startRec();
}

function startRec() {
  recBusy = true;
  // Costruisce un nuovo oggetto SpeechRecognition ogni volta
  rec = new SRClass();
  rec.continuous      = false;  // iOS: false evita duplicati
  rec.interimResults  = true;
  rec.lang            = 'it-IT';
  rec.maxAlternatives = 1;

  rec.onstart = function() {
    recBusy = false;
  };

  rec.onresult = function(e) {
    // Processa solo i risultati nuovi a partire da e.resultIndex
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var res = e.results[i];
      var t   = res[0] ? String(res[0].transcript || '') : '';
      if (res.isFinal) {
        fin  += t + ' ';
        intr  = '';
        segmenti++;
      } else {
        intr = t;
      }
    }
    aggiornaTbox();
  };

  rec.onerror = function(e) {
    recBusy = false;
    if (e.error === 'no-speech') {
      // Silenzio: riavvia automaticamente se stiamo ancora registrando
      if (staRec) scheduleRestart();
      return;
    }
    // Errore vero: ferma tutto
    staRec = false;
    resetUI();
    var msg = {
      'not-allowed': '⚠ Consenti il microfono nelle impostazioni del browser',
      'network':     '⚠ Errore di rete — la trascrizione richiede connessione'
    };
    toast(msg[e.error] || ('Errore microfono: ' + e.error));
  };

  rec.onend = function() {
    recBusy = false;
    intr = '';
    aggiornaTbox();
    // Se l'utente sta ancora registrando, riavvia
    if (staRec) scheduleRestart();
  };

  staRec = true;
  try {
    rec.start();
  } catch(e) {
    recBusy = false;
    staRec  = false;
    toast('Errore avvio microfono: ' + e.message);
    return;
  }

  // UI
  document.getElementById('micBtn').classList.add('rec');
  document.getElementById('stato').textContent = '● Sto ascoltando…';
  document.getElementById('stato').className   = 'rec';
  document.getElementById('wave').classList.add('on');
}

function scheduleRestart() {
  if (!staRec || recBusy) return;
  recBusy = true;
  setTimeout(function() {
    if (!staRec) { recBusy = false; return; }
    recBusy = false;
    startSegmento();
  }, 250);
}

// Riavvia solo il riconoscitore (senza toccare fin) per continuare a dettare
function startSegmento() {
  if (!staRec || recBusy) return;
  recBusy = true;
  rec = new SRClass();
  rec.continuous      = false;
  rec.interimResults  = true;
  rec.lang            = 'it-IT';
  rec.maxAlternatives = 1;

  rec.onstart  = function() { recBusy = false; };
  rec.onresult = function(e) {
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var res = e.results[i];
      var t   = res[0] ? String(res[0].transcript || '') : '';
      if (res.isFinal) { fin += t + ' '; intr = ''; segmenti++; }
      else             { intr = t; }
    }
    aggiornaTbox();
  };
  rec.onerror = function(e) {
    recBusy = false;
    if (e.error === 'no-speech' && staRec) { scheduleRestart(); return; }
    if (e.error !== 'aborted') { staRec = false; resetUI(); }
  };
  rec.onend = function() {
    recBusy = false; intr = ''; aggiornaTbox();
    if (staRec) scheduleRestart();
  };

  try { rec.start(); } catch(e) { recBusy = false; }
}

function stopRec() {
  staRec  = false;
  recBusy = false;
  intr    = '';
  try { if (rec) rec.abort(); } catch(e) {}
  resetUI();
  aggiornaTbox();
}

function resetUI() {
  document.getElementById('micBtn').classList.remove('rec');
  document.getElementById('stato').textContent = 'Tocca il microfono per dettare';
  document.getElementById('stato').className   = '';
  document.getElementById('wave').classList.remove('on');
}

function aggiornaTbox() {
  var box  = document.getElementById('tbox');
  var finS  = fin  || '';
  var intrS = intr || '';
  var tutto = (finS + intrS).trim();
  if (!tutto) {
    box.innerHTML = '<span class="ph">La trascrizione apparirà qui…</span>';
    document.getElementById('btnS').disabled = true;
    return;
  }
  box.innerHTML = esc(finS) + (intrS ? '<span class="int">' + esc(intrS) + '</span>' : '');
  document.getElementById('btnS').disabled = !finS.trim();
}

function cancella() {
  fin = ''; intr = ''; segmenti = 0;
  if (staRec) stopRec();
  aggiornaTbox();
}

// ── SALVA SU SHEETS ──
function salva() {
  var testo = (fin || '').trim();
  if (!testo) return;

  var n = {
    id:    Date.now(),
    testo: testo,
    ts:    new Date().toLocaleString('it-IT'),
    fatto: false,
    sync:  'sending'
  };
  note.unshift(n);
  persisti();
  aggiornaBadge();
  cancella();
  toast('💾 Salvataggio…');

  var url = GAS_URL + '?text=' + encodeURIComponent(testo) + '&status=Aperta';
  fetch(url, { method: 'GET', mode: 'no-cors' })
    .then(function() {
      n.sync = 'ok';
      toast('✅ Salvata su Google Sheets!');
      persisti(); aggiornaBadge();
    })
    .catch(function(e) {
      n.sync = 'err';
      toast('❌ Errore invio: ' + e.message);
      persisti(); aggiornaBadge();
    });
}

// ── NOTE ──
function aggiornaBadge() {
  var aperte = note.filter(function(n){ return !n.fatto; }).length;
  document.getElementById('cntBadge').textContent = aperte;
}

function renderNote() {
  var aperte = note.filter(function(n){ return !n.fatto; });
  var fatte  = note.filter(function(n){ return  n.fatto; });
  document.getElementById('cntAperte').textContent = aperte.length;
  document.getElementById('cntFatte').textContent  = fatte.length;
  document.getElementById('cntTutte').textContent  = note.length;
  document.getElementById('tabContentAperte').innerHTML = buildLista(aperte);
  document.getElementById('tabContentFatte').innerHTML  = buildLista(fatte);
  document.getElementById('tabContentTutte').innerHTML  = buildLista(note);
}

function buildLista(lista) {
  if (!lista.length) return '<div class="vuoto">Nessuna nota qui</div>';
  var sm = { ok:'p-ok ✅ Sheets', sending:'p-snd ⟳', err:'p-err ❌', local:'p-pnd 📵' };
  return lista.map(function(n) {
    var parts = (sm[n.sync] || 'p-pnd ⏳').split(' ');
    var sc = parts.shift(), sl = parts.join(' ');
    return '<div class="nota">' +
      '<div class="chk ' + (n.fatto ? 'fatto' : '') + '" onclick="toggleNota(' + n.id + ')">' + (n.fatto ? '✓' : '') + '</div>' +
      '<div class="nota-body">' +
        '<div class="ntxt ' + (n.fatto ? 'fatto' : '') + '">' + esc(n.testo) + '</div>' +
        '<div class="nts">' + n.ts + '</div>' +
      '</div>' +
      '<span class="pill ' + sc + '">' + sl + '</span>' +
      '<div class="btn-del" onclick="eliminaNota(' + n.id + ')" title="Elimina">🗑</div>' +
    '</div>';
  }).join('');
}

function eliminaNota(id) {
  if (!confirm('Eliminare questa nota?')) return;
  note = note.filter(function(x){ return x.id !== id; });
  persisti(); aggiornaBadge(); renderNote();
  toast('🗑 Nota eliminata');
}

function toggleNota(id) {
  var n = note.find(function(x){ return x.id === id; });
  if (!n) return;
  n.fatto = !n.fatto;
  persisti(); aggiornaBadge(); renderNote();
}

// ── UTILS ──
function persisti() { localStorage.setItem('vn8', JSON.stringify(note)); }
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
var tt;
function toast(m) {
  var el = document.getElementById('toast');
  el.textContent = m; el.classList.add('on');
  clearTimeout(tt); tt = setTimeout(function(){ el.classList.remove('on'); }, 3500);
}

init();
</script>
</body>
</html>
